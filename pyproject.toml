[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "inputforge"
version = "0.1.0"
description = "Game-tauglicher Makro-, Hotkey- und Bildsuche-Automatisierer mit grafischer Konfiguration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "InputForge Contributors" }]
keywords = ["macro", "hotkey", "automation", "gaming", "image-search", "sendinput"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.6",
    "pydantic>=2.6",
    "platformdirs>=4.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "mss>=9.0",
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyinstaller>=6.6",
]

[project.scripts]
inputforge-cli = "inputforge.cli:main"

[project.gui-scripts]
inputforge = "inputforge.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inputforge"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "packaging", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # deutsche Umlaute/Typografie in Strings erlaubt

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# ctypes.WinDLL & Co. existieren nur unter Windows – CI prüft das Modul dort.
module = "inputforge.platform.win32"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["Xlib", "Xlib.*"]
ignore_missing_imports = true
