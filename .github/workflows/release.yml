name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Version prüfen
        shell: bash
        run: |
          v=$(python -c "import inputforge; print(inputforge.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != Version $v"; exit 1; }
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build (portable)
        run: pyinstaller packaging/inputforge.spec --noconfirm --clean
      - name: Build (Admin-Variante)
        env:
          INPUTFORGE_UAC_ADMIN: "1"
          INPUTFORGE_ONEFILE: "1"
        run: pyinstaller packaging/inputforge.spec --noconfirm --distpath dist-admin
      - name: Pakete schnüren
        shell: pwsh
        run: |
          $v = python -c "import inputforge; print(inputforge.__version__)"
          Compress-Archive -Path "dist/InputForge-$v" -DestinationPath "InputForge-$v-win64.zip"
          Move-Item dist-admin/InputForge.exe "InputForge-$v-win64-admin.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            InputForge-*-win64.zip
            InputForge-*-win64-admin.exe

  build-linux:
    # Älteste unterstützte Basis → glibc-kompatibel mit Mint 21+/Ubuntu 22.04+
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 xvfb xdotool
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: xvfb-run -a pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          INPUTFORGE_X11_TESTS: "1"
      - run: bash packaging/build.sh --skip-tests
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/InputForge-*-linux-x86_64.tar.gz

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
