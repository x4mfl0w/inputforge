name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Systempakete (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 xvfb xdotool
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: mypy
        run: mypy src --platform ${{ runner.os == 'Windows' && 'win32' || 'linux' }}
      - name: pytest (Windows)
        if: runner.os == 'Windows'
        run: pytest --cov=inputforge --cov-report=term-missing
      - name: pytest (Linux, inkl. X11-Integration auf Xvfb)
        if: runner.os == 'Linux'
        env:
          INPUTFORGE_X11_TESTS: "1"
        run: xvfb-run -a pytest --cov=inputforge --cov-report=term-missing
      - name: Beispielprofile validieren
        run: |
          inputforge-cli validate examples/grim_dawn/grim_dawn.json
          inputforge-cli validate examples/cli_quickstart/cli_quickstart.json
